name: publication evaluation

on:
  push:
    branches: [publication/readiness]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-gates:
    name: Deterministic failure injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run publication evaluation subset
        run: |
          python3 test/publication_evaluation.py --json publication-evaluation.json
      - name: Show paper-ready result table
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path('publication-evaluation.json')
          if not p.exists():
              raise SystemExit('evaluation JSON was not produced')
          d = json.loads(p.read_text())
          lines = [
              '| ID | Scenario | Passed | Duration (ms) |',
              '|---|---|---:|---:|',
          ]
          for r in d['results']:
              lines.append(
                  f"| {r['id']} | {r['scenario']} | "
                  f"{'yes' if r['passed'] else 'NO'} | {r['duration_ms']:.3f} |"
              )
          lines.append('')
          lines.append(f"**{d['passed']}/{d['scenarios_run']} deterministic scenarios passed.**")
          lines.append('')
          lines.append(f"Commit: `{d['commit']}`")
          table = '\n'.join(lines)
          print(table)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## AutoResearch HPC publication evaluation\n\n')
                  handle.write(table + '\n')
          PY
      - name: Upload machine-readable evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evaluation-${{ github.sha }}
          path: publication-evaluation.json
          if-no-files-found: error
          retention-days: 90
