name: publication hygiene

on:
  push:
    branches: [publication/readiness]
  pull_request:
  workflow_dispatch:
    inputs:
      scan_history:
        description: Scan full Git history as well as the current tree
        required: false
        default: false
        type: boolean

jobs:
  current-tree:
    name: Current tree release audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current tracked tree
        run: |
          python3 scripts/public-release-audit.py --tree --json publication-audit.json
      - name: Reproduce synthetic publication fixture
        run: |
          bash examples/mean-shift/check.sh

  history:
    name: Full-history audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_history }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history
        run: |
          python3 scripts/public-release-audit.py --history --json publication-history-audit.json
