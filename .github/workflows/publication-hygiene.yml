name: publication hygiene

on:
  push:
    branches: [publication/readiness]
  pull_request:
  workflow_dispatch:
    inputs:
      scan_history:
        description: Scan full Git history as well as the current tree
        required: false
        default: false
        type: boolean

jobs:
  current-tree:
    name: Current tree release audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release-audit redaction
        run: |
          python3 test/test_public_release_audit.py
      - name: Scan current tracked tree
        run: |
          python3 scripts/public-release-audit.py --tree --json publication-audit.json
      - name: Reproduce synthetic publication fixture
        run: |
          bash examples/mean-shift/check.sh
      - name: Upload redacted tree audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-tree-audit-${{ github.sha }}
          path: publication-audit.json
          if-no-files-found: warn
          retention-days: 90

  history:
    name: Full-history audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_history }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history
        run: |
          python3 scripts/public-release-audit.py --history --json publication-history-audit.json
      - name: Upload redacted history audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-history-audit-${{ github.sha }}
          path: publication-history-audit.json
          if-no-files-found: warn
          retention-days: 30
