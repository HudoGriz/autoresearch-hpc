name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Singularity integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      - name: Configure driver and task runtime
        run: |
          mkdir -p "$PWD/.ci/bin"
          ln -s "$(command -v apptainer)" "$PWD/.ci/bin/singularity"
          export PATH="$PWD/.ci/bin:$PWD/bin:$PATH"
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
          echo "$PWD/bin" >> "$GITHUB_PATH"
          bin/arh init "$PWD/.ci/study" --bootstrap
          test -x "$PWD/.ci/study/.arh/tools/micromamba/2.8.1-0/linux-64/micromamba"
          grep -q '^source=downloaded$' "$PWD/.ci/study/.arh/micromamba.lock"
          singularity pull "$PWD/.ci/runtime.sif" docker://mambaorg/micromamba:2.8.1
          scripts/setup-runtime.sh "$PWD/.ci/study" "$PWD/.ci/runtime.sif"
          bin/arh --version
          bin/arh --help >/dev/null
          bin/arh doctor || true
      - name: Test suite
        run: |
          export ARH_TEST_SITE="$PWD/.ci/study/.arh/config/site.md"
          test/run_tests.sh
          python3 test/test_hardening.py
      - name: Protocol conformance is actually enforced
        run: |
          for c in "concurrent claims" "unfilled" "results exist" \
                   "tampering" "frozen hash" "outside" "same-family" \
                   "does not leak the code"; do
            grep -qi -- "$c" test/run_tests.sh || { echo "uncovered: $c"; exit 1; }
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning --shell=bash \
            bin/arh bin/arh-* lib/*.sh harness/install.sh scripts/setup-nextflow.sh test/run_tests.sh

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON is valid
        run: |
          python3 - <<'EOF'
          import json, glob
          for f in sorted(glob.glob('schema/*.json') + glob.glob('harness/**/*.json', recursive=True)):
              json.load(open(f)); print('ok', f)
          EOF
